# ==============================================================================
# Mosquitto MQTT Broker Configuration for Nimble Kharj (AWS EC2)
# File destination on Ubuntu: /etc/mosquitto/conf.d/kharj_mosquitto.conf
# ==============================================================================

# General persistence
persistence true
persistence_location /var/lib/mosquitto/

# Logging
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# ------------------------------------------------------------------------------
# 1. Standard MQTT TCP Listener (for IoT Edge Dispensers & Local Worker)
# ------------------------------------------------------------------------------
listener 1883 0.0.0.0
# For development/internal network: allow anonymous
allow_anonymous true

# For production security with username/password, uncomment below:
# allow_anonymous false
# password_file /etc/mosquitto/passwd

# ------------------------------------------------------------------------------
# 2. WebSocket Listener (Optional: for direct browser MQTT connections)
# ------------------------------------------------------------------------------
listener 9001 0.0.0.0
protocol websockets

