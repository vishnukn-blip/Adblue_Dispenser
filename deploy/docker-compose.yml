version: '3.8'

services:
  adblue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adblue-worker
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - adblue_data:/data
    environment:
      - MQTT_HOST=172.17.0.1
      - MQTT_PORT=1883
      - MQTT_USER=adblue_iot
      - MQTT_PASS=adblue@2026
      - API_PORT=8001
      - DB_PATH=/data/adblue_dispense.db

volumes:
  adblue_data:

